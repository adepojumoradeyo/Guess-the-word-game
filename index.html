<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="px-6 py-5 bg-slate-300 h-screen lg:px-10 md:text-center">
      <h1 class="text-xl pb-5 text-center font-bold">Guess Letter Game</h1>

      <p class="hint">Hint: A Programing Language</p>
      <div class="word_display font-bold text-4xl text-white my-5"></div>
      <div class="flex justify-center">
        <input
          type="text"
          maxlength="1"
          class="input_letter w-10 text-xl text-center"
        />
      </div>

      <div class="flex gap-10 my-4">
        <button class="guess">submit</button>
        <button class="restart">restart</button>
      </div>

      <div class="flex gap-5">
        <p>
          Wrong Guess:
          <span class="wrong_guesses text-xl"></span>
        </p>
      </div>

      <p class="attempt">Attempts left: <span class="attempts_left">6</span></p>

      <div class="message text-red-600 text-4xl text-center"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
